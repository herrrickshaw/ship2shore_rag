services:
  # Apache Kafka, KRaft mode (no separate ZooKeeper — meaningfully lighter,
  # and the standard mode for any Kafka deployed since 3.x). Single broker,
  # single partition per topic — a dev-scale message bus, not a cluster.
  #
  # This is now the only container in the stack. The original design also
  # ran Cassandra (data lake) and Flink jobmanager+taskmanager (windowed
  # aggregation) — both removed in favor of DuckDB (warehouse/schema.sql,
  # warehouse/duckdb_writer.py): a single embedded file written directly by
  # a plain Python Kafka consumer, with the aggregation done as a SQL view
  # instead of a standing stream job. See warehouse/README.md for why.
  kafka:
    image: apache/kafka:3.9.0
    container_name: s2s-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
    deploy:
      resources:
        limits:
          memory: 512m
