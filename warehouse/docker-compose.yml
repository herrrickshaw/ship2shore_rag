services:
  # Apache Kafka, KRaft mode (no separate ZooKeeper — meaningfully lighter,
  # and the standard mode for any Kafka deployed since 3.x). Single broker,
  # single partition per topic — a dev-scale message bus, not a cluster.
  kafka:
    image: apache/kafka:3.9.0
    container_name: s2s-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
    deploy:
      resources:
        limits:
          memory: 512m

  # Single-node Cassandra — the data lake: high-write-throughput wide-column
  # storage for raw sensor telemetry, distinct from the low-frequency
  # structured records in the Postgres ops module.
  cassandra:
    image: cassandra:5.0
    container_name: s2s-cassandra
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: "1024m"
      HEAP_NEWSIZE: "256m"
      CASSANDRA_CLUSTER_NAME: ship2shore
    deploy:
      resources:
        limits:
          memory: 2048m
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 15

  # Flink — the stream processor sitting between Kafka and Cassandra:
  # windowed aggregation of raw telemetry before it lands in the lake.
  # NOTE on sizing: 512m process.size was tried first and failed outright —
  # Flink's own memory accounting requires >=192m JVM overhead + >=128m
  # off-heap before any heap is left, so anything under ~768m for the
  # jobmanager fails to start at all (verified: it crashed with
  # IllegalConfigurationException, not a vague OOM). 1024m is the smallest
  # size that both starts cleanly and leaves a usable amount of heap.
  flink-jobmanager:
    image: flink:1.19-scala_2.12-java17
    container_name: s2s-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
    deploy:
      resources:
        limits:
          memory: 1152m

  flink-taskmanager:
    image: flink:1.19-scala_2.12-java17
    container_name: s2s-flink-taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1024m
    deploy:
      resources:
        limits:
          memory: 1152m
