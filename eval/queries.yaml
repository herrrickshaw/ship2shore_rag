# Hand-curated retrieval eval set — real queries against the actual ingested
# corpus (not invented data), one unambiguous document per query so a hit/miss
# is a clean signal. Built by inspecting `documents` directly (see
# eval/evaluate.py docstring for how to regenerate/extend this).
#
# expected_urls is a list so a query CAN have more than one acceptable answer
# later; every entry here currently has exactly one.
- question: "what causes a man overboard incident on a bulk carrier"
  expected_urls:
    - "https://assets.publishing.service.gov.uk/media/6a6091d10dd52549f5f96ce3/2026-16-WorldPrize-Report.pdf"
