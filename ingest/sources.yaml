# Curate additional PDF/URL literature here. Only add sources you have the
# right to ingest (public domain, freely licensed, or your own documents).
#
# UNCTAD's annual "Review of Maritime Transport" is published openly:
# https://unctad.org/publication/review-maritime-transport-2024
# Add the direct PDF link(s) you want ingested below.
#
# NTSB marine accident reports are U.S. government works (17 U.S.C. §105 —
# public domain) but NTSB has no stable public feed like MAIB's Atom feed:
# its search UI (CAROL, data.ntsb.gov) is a private JS API, not a documented
# one, so report URLs are curated by hand here rather than auto-crawled.
# Find more at https://data.ntsb.gov/carol-main-public/basic-search
# (Mode = Marine) — report PDFs live at a stable, predictable path:
# https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR####.pdf
#
# DNV class rules (RU-SHIP) are free and public at rules.dnv.com, but
# distributed only as whole-edition ZIP archives (hundreds of PDFs each), not
# individually crawlable chapter links — see:
# https://rules.dnv.com/servicedocuments/dnvpm/packages?category=rulesship
# To use a specific chapter: download the edition ZIP yourself, extract it,
# then ingest the PDFs you want with `cli.py ingest --source file --path`
# rather than adding them here.
#
# Some formats genuinely have no public source to crawl at all — they're
# per-vessel/per-company private documents by nature, not published
# literature: PMS (planned maintenance system) technical manuals, SIRE 2.0 /
# CDI vetting inspection reports, and statutory certificates (SOLAS/MARPOL/
# ISM/ISPS). Ingest your own copies of these via `--source file` — there is
# no fetcher for them here because there is nothing public to fetch.

