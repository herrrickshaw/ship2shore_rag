[tool.pytest.ini_options]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]   # pyflakes (dead code/imports), pycodestyle, isort
# E402: this repo's config.py loads .env before other imports read env vars,
# and several modules do lazy/conditional imports inside functions (heavy
# ML deps deferred to first use, e.g. ingest/embed.py, retrieval/rerank.py).
# E501 line length is handled by black.
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]   # fixtures sometimes bind unused locals for clarity
